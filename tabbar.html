<!doctype html><meta charset="utf-8"><title>Canva-linux</title><style>
html,body{margin:0;height:55px;overflow:hidden}
body{background:linear-gradient(90deg,#0e99a5,#642eb9);font:600 15px sans-serif;color:#fff;display:flex;align-items:flex-end;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dots{width:44px;height:55px;margin-left:13px;padding-top:6px;box-sizing:border-box}
#home{width:44px;height:47px;margin-left:21px;padding-bottom:5px;box-sizing:border-box}
#home.on{background:linear-gradient(90deg,#01c4cc,#7d2be8) fixed;background-size:100vw 100%;border-radius:10px 10px 0 0}
#t{display:flex;align-items:flex-end;gap:2px;min-width:0;margin-left:8px}
.tab{box-sizing:border-box;display:flex;align-items:center;height:47px;flex:0 1 244px;width:244px;min-width:110px;padding:0 11px 0 15px;gap:13px;border-radius:10px 10px 0 0;background:rgba(255,255,255,.2);cursor:pointer;overflow:hidden}
.tab.on{background:linear-gradient(90deg,#01c4cc,#7d2be8) fixed;background-size:100vw 100%}
.ic{width:20px;height:20px;flex:none;border-radius:4px}
.title{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:.7}
.x:hover{background:rgba(255,255,255,.2);opacity:1}
#new{width:36px;height:55px;margin-left:12px;padding-top:3px;box-sizing:border-box}
#drag{flex:1;height:55px;-webkit-app-region:drag}
.wb{width:57px;height:55px}
.wb:hover{background:rgba(255,255,255,.15)}
#close:hover{background:#e81123}
</style>
<button id="dots"><svg width="22" height="4" fill="currentColor"><circle cx="2" cy="2" r="2"/><circle cx="11" cy="2" r="2"/><circle cx="20" cy="2" r="2"/></svg></button>
<button id="home"><svg width="22" height="21" viewBox="0 0 22 21"><path d="M2 9.5 11 2l9 7.5V19a1 1 0 0 1-1 1h-5v-6H8v6H3a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
<div id="t"></div>
<button id="new"><svg width="14" height="14"><path d="M7 0v14M0 7h14" stroke="currentColor" stroke-width="2"/></svg></button>
<div id="drag"></div>
<button class="wb" id="min"><svg width="13" height="13"><path d="M0 6.5h13" stroke="currentColor" stroke-width="1.5"/></svg></button>
<button class="wb" id="max"></button>
<button class="wb" id="close"><svg width="13" height="13"><path d="M1 1l11 11M12 1L1 12" stroke="currentColor" stroke-width="1.5"/></svg></button>
<script>
const $=id=>document.getElementById(id);
const XS='<svg width="12" height="12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>';
const MAXI='<svg width="13" height="13"><rect x=".75" y=".75" width="11.5" height="11.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
const REST='<svg width="13" height="13"><path d="M3.5 3.5V.75h8.75V9.5H9.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x=".75" y="3.5" width="8.75" height="8.75" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
let homeId=null;
$('max').innerHTML=MAXI;
api.onMax(m=>{$('max').innerHTML=m?REST:MAXI});
$('dots').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();api.menu(Math.round(r.left),Math.round(r.bottom))};
$('home').onclick=()=>{if(homeId)api.switchTab(homeId)};
$('new').onclick=()=>api.newTab();
$('min').onclick=()=>api.win('min');
$('max').onclick=()=>api.win('max');
$('close').onclick=()=>api.win('close');
api.onTabs(list=>{
  $('t').innerHTML='';
  list.forEach(x=>{
    if(x.pinned){homeId=x.id;$('home').classList.toggle('on',x.active);return}
    const d=document.createElement('div');d.className='tab'+(x.active?' on':'');
    let i;if(x.favicon){i=document.createElement('img');i.src=x.favicon}else{i=document.createElement('span')}
    i.className='ic';d.append(i);
    const s=document.createElement('span');s.className='title';s.textContent=x.title;d.append(s);
    const c=document.createElement('span');c.className='x';c.innerHTML=XS;
    c.onclick=e=>{e.stopPropagation();api.closeTab(x.id)};
    d.append(c);d.onclick=()=>api.switchTab(x.id);$('t').append(d);
  });
});
</script>
